name: Build & Deploy GH Pages

# ──────────────────────────────────────────────────────────────────────
# Léopards Radar — build + déploiement automatique sur gh-pages.
#
# Avant : déploiement manuel depuis le poste local (npm run deploy),
# dépendant d'un token PAT dans le remote (expiré en juillet 2026,
# déploiements bloqués pendant 7 semaines sans que rien ne le signale).
# Maintenant : chaque push sur main reconstruit et publie. Le garde-fou
# copy (scripts/check-copy.mjs) bloque le build si un tiret cadratin
# traîne dans du texte affiché.
# ──────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (avec garde-fou copy)
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

      # Vercel rebuild de son cote (base "/", VERCEL=1) : on ne pousse pas
      # le dist gh-pages, on delegue le build a Vercel via le CLI.
      # Connexion Git native impossible tant que le compte Vercel n'a pas
      # de Login Connection GitHub : ce step fait le meme travail.
      #
      # continue-on-error : le plan gratuit Vercel plafonne les uploads a
      # 5000/jour (api-upload-free). Un jour a gros volume de merges sature
      # la limite et fait echouer ce step ~24h. Comme gh-pages (au-dessus)
      # est la cible verifiee et bloquante, on ne veut pas que ce plafond
      # transitoire fasse virer tout le workflow au rouge. Le build et le
      # deploy gh-pages restent bloquants ; seul Vercel est tolere en echec.
      - name: Deploy to Vercel (production)
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_WgOfSMY7ogd7xGB0x3wLq71C
          VERCEL_PROJECT_ID: prj_qgMxFIeeRzKk5oYqAK0gkATIKlSU
        run: npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

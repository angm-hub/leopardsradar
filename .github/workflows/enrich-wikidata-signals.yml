name: Enrich Wikidata signals (mensuel)

# Enrichit les SIGNAUX d'eligibilite depuis Wikidata (gratuit, pas d'anti-bot) :
# citoyennete (P27), selections nationales (P54, signal cap-tied), pays de naissance (P19->P17).
# Ne remplit que le vide, ne touche JAMAIS computed_eligibility_status (signal != verdict).
# Complementaire de discover_wikidata.py (decouverte de nouveaux joueurs).
#
# Cron mensuel : ne traite par defaut que les fiches jamais scannees (wikidata_checked_at null),
# donc surtout les nouveaux joueurs ajoutes depuis le dernier passage. Volume mensuel faible.
# Rescan complet possible a la main via l'input rescan_all.

on:
  schedule:
    - cron: '0 6 1 * *'   # 1er du mois, 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Limite (vide = tous)"
        required: false
        default: ""
      rescan_all:
        description: "Rejouer les fiches deja scannees sans data (matcher ameliore)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run (aucune ecriture)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: enrich-wikidata-signals
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run Wikidata signal enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: scripts
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.rescan_all }}" = "true" ]; then ARGS="$ARGS --rescan-all"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python enrich_wikidata_signals.py $ARGS

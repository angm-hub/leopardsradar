name: Fact-check éligibilité RDC (Wikidata)

# ──────────────────────────────────────────────────────────────────────
# Léopards Radar — Vérification systématique de l'éligibilité RDC.
#
# Tranche chaque fiche sur des SOURCES (Wikidata), pas sur des heuristiques
# de patronyme. Distingue la RD Congo (Q974) de la République du Congo /
# Brazzaville (Q971) — la confusion qui avait taggé des Congolais de
# Brazzaville (ex. Samba) comme éligibles RDC.
#
# Repo public → minutes GitHub Actions illimitées.
# Batch incrémental : 60 fiches / run par défaut, priorité aux fiches en
# attente. Couverture de ~1 000 fiches en quelques semaines.
# ──────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Lundi 04:00 UTC : les fiches mises en attente d'abord
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Périmètre à fact-checker'
        required: false
        default: 'held'
        type: choice
        options: ['held', 'unverified', 'all']
      limit:
        description: 'Nombre de fiches par run (défaut 60)'
        required: false
        default: '60'
      dry_run:
        description: 'Simulation (aucune écriture)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  factcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: factcheck-players
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fact-check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/factcheck_players.py \
            --scope "${{ github.event.inputs.scope || 'held' }}" \
            --limit "${{ github.event.inputs.limit || '60' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

name: Sync Transfermarkt RDC pool

# ──────────────────────────────────────────────────────────────────────
# Léopards Radar — Job hebdo de refresh des profils Transfermarkt.
# Tourne tous les dimanches 03:00 UTC.
#
# Repo public → minutes GitHub Actions illimitées.
# Refresh incrémental : 200 joueurs / run (les plus anciens d'abord).
# Couverture complète d'un pool de 1500 joueurs en ~8 semaines.
# ──────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Sunday 03:00 UTC = Sunday 04:00 Paris (UTC+1) / 05:00 (UTC+2 été)
    - cron: '0 3 * * 0'
    # 2e passage hebdo (audit 2026-07-09) : couverture valeurs trop lente a
    # 200 joueurs/semaine pour ~1 100 actifs. Dimanche + mercredi.
    - cron: '0 3 * * 3'
  workflow_dispatch:        # déclenchement manuel depuis l'UI GitHub
    inputs:
      batch_size:
        description: 'Number of players to refresh (default 200)'
        required: false
        default: '200'
      rate_limit:
        description: 'Seconds between Transfermarkt requests (default 3.0)'
        required: false
        default: '3.0'
      use_playwright:
        description: 'Use Chromium headless (bypass Cloudflare ban) — recommended now'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      is_retry:
        description: 'Interne : marque un run de retry anti-403 (ne pas re-retenter)'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: write   # requis pour le re-dispatch du job retry-nouvelle-ip

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # max 5h50 (limite GH = 6h)
    concurrency:
      group: sync-transfermarkt
      cancel-in-progress: false   # un run en cours bloque les suivants

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright Chromium (if needed)
        if: ${{ github.event.inputs.use_playwright != 'false' }}
        run: python -m playwright install --with-deps chromium

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '200' }}
          RATE_LIMIT_SECONDS: ${{ github.event.inputs.rate_limit || '3.0' }}
          USE_PLAYWRIGHT: ${{ github.event.inputs.use_playwright || 'true' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: scripts
        run: python sync_transfermarkt.py

  # TM sert des 403 a certaines IP de runners GitHub (incidents 05/07, 10/07,
  # 15/07 : 200/200 parses "Unknown"). Un nouveau run = un nouveau runner =
  # une nouvelle IP, ce qui a suffi a chaque relance manuelle. Sur echec,
  # ce job re-declenche le meme workflow UNE fois (garde anti-boucle is_retry).
  retry-nouvelle-ip:
    needs: sync
    if: failure() && github.event.inputs.is_retry != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-dispatch sur un runner neuf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 120
          gh workflow run sync-transfermarkt.yml --repo ${{ github.repository }} -f is_retry=true

name: Backfill TM Portraits

# ──────────────────────────────────────────────────────────────────────
# Léopards Radar — Portraits Transfermarkt vers le storage pour les
# joueurs actifs sans aucune photo (audit data 2026-07-09 : 243 fiches).
# Portrait officiel TM (og:image) -> bucket player-photos -> image_url.
# Cadence : hebdo jeudi 04h30 UTC + manuel. ~130 joueurs/run (rate TM).
# ──────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '30 4 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run : affiche sans écrire (true/false)'
        required: false
        default: 'false'
      limit:
        description: 'Nombre max de joueurs traités'
        required: false
        default: '130'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Backfill TM portraits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: scripts
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '130' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python backfill_tm_portraits.py $ARGS
